# project.yml plus iCloud key-value storage (favourites, My List, progress and playlists sync
# between iPhone and iPad, see Lumen/Data/CloudSync.swift). Only a paid developer team can sign
# it, so ./generate.sh uses this file only when Config/Local.xcconfig has the line
#   LUMEN_ICLOUD = YES
# Without it the app builds with a free Personal Team and simply doesn't sync.
include:
  - project.yml
targets:
  Lumen:
    entitlements:
      path: Lumen/Lumen.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
  LumenMac:
    entitlements:
      path: Mac/Lumen.entitlements
      properties:
        # The iPhone/iPad app's iCloud store and keychain, so favourites, My List, progress and
        # playlist logins are the same on the Mac.
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.hayat.lumen
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.hayat.lumen
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ["$(inherited)", "LUMEN_ICLOUD"]
